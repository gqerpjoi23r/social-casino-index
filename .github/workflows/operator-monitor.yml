name: Daily operator monitor

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: operator-monitor
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npm run monitor:test
      - name: Collect public sources
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: npm run monitor:run
      - name: Preserve captures and evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-captures-${{ github.run_id }}
          path: .monitor/
          include-hidden-files: true
          retention-days: 14
      - run: npm run release
      - name: Commit validated observations
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "Social Casino Index monitor"
          git config user.email "monitor@users.noreply.github.com"
          git add src/_data/monitor.json data/monitor/runs docs
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily operator source observations"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
