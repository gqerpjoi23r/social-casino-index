name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate content schema
        run: npm run content:validate

      - name: Build flat HTML
        run: npm run build

      - name: Verify build output is committed
        run: |
          if ! git diff --quiet docs/; then
            echo "docs/ is out of date. Run 'npm run build' and commit the output."
            git diff --stat docs/
            exit 1
          fi
